name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/integration/runTests.mjs
      - name: Integration tests
        if: runner.os != 'Linux'
        run: node test/integration/runTests.mjs
      - name: Package
        if: runner.os == 'Linux'
        run: npx vsce package
      - name: Integration tests against the packaged VSIX (no node_modules)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/vsix && unzip -q *.vsix -d /tmp/vsix
          PV_EXTENSION_PATH=/tmp/vsix/extension xvfb-run -a node test/integration/runTests.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
